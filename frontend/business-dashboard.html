<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Business Dashboard - BossUp EA</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="assets/css/variables.css" rel="stylesheet" />
    <link href="assets/css/dashboard.css" rel="stylesheet" />
    <link href="assets/css/i18n.css" rel="stylesheet" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewbox="0 0 24 24"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            <div>
              BossUp EA
              <small>Business Portal</small>
            </div>
          </div>
        </div>
        <!-- User Profile -->
        <div class="sidebar-user">
          <img
            alt="Grace Mutesi"
            class="sidebar-user-avatar"
            src="https://randomuser.me/api/portraits/women/44.jpg"
          />
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Grace Mutesi</div>
            <div class="sidebar-user-role verified">✓ Verified Business</div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section">
            <a class="nav-item active" href="#dashboard-records">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <rect height="7" width="7" x="3" y="3"></rect>
                <rect height="7" width="7" x="14" y="3"></rect>
                <rect height="7" width="7" x="14" y="14"></rect>
                <rect height="7" width="7" x="3" y="14"></rect>
              </svg>
              Dashboard
            </a>
            <a class="nav-item" href="marketplace.html">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                ></path>
                <polyline points="14,2 14,8 20,8"></polyline>
                <line x1="16" x2="8" y1="13" y2="13"></line>
                <line x1="16" x2="8" y1="17" y2="17"></line>
                <polyline points="10,9 9,9 8,9"></polyline>
              </svg>
              My Campaigns
              <span class="badge">2</span>
            </a>
            <a class="nav-item" href="#dashboard-records">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              Donors
            </a>
            <a class="nav-item" href="#dashboard-records">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                ></path>
              </svg>
              Messages
              <span class="badge">5</span>
            </a>
          </div>
          <div class="nav-section">
            <div class="nav-section-title">Tools</div>
            <a class="nav-item" href="#dashboard-records">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <line x1="18" x2="18" y1="20" y2="10"></line>
                <line x1="12" x2="12" y1="20" y2="4"></line>
                <line x1="6" x2="6" y1="20" y2="14"></line>
              </svg>
              Analytics
            </a>
            <a class="nav-item" href="learning.html">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
              </svg>
              Learning Centre
            </a>
            <a class="nav-item" href="#dashboard-records">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4"
                ></path>
              </svg>
              Settings
            </a>
          </div>
        </nav>
        <div class="sidebar-footer">
          <a class="nav-item" href="#dashboard-records">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewbox="0 0 24 24"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16,17 21,12 16,7"></polyline>
              <line x1="21" x2="9" y1="12" y2="12"></line>
            </svg>
            Logout
          </a>
        </div>
      </aside>
      <!-- Main Content -->
      <main class="dashboard-main">
        <!-- Header -->
        <header class="dashboard-header">
          <div class="header-actions">
            <a class="btn btn-primary" href="marketplace.html"
              >Browse campaigns</a
            ><a class="btn btn-outline" href="create-campaign.html"
              >New campaign</a
            >
          </div>
        </header>
        <!-- Dashboard Content -->
        <div class="dashboard-content">
          <div class="page-header">
            <h1 id="dashboard-title">Loading dashboard…</h1>
            <p id="dashboard-message" role="status"></p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-header">
                <span class="stat-card-label">Total Raised</span>
                <div class="stat-card-icon">
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                  >
                    <path d="M12 1v22"></path>
                    <path
                      d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                    ></path>
                  </svg>
                </div>
              </div>
              <div class="stat-card-value">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-header">
                <span class="stat-card-label">Current Balance</span>
                <div class="stat-card-icon gold">
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                  >
                    <rect
                      height="16"
                      rx="2"
                      ry="2"
                      width="22"
                      x="1"
                      y="4"
                    ></rect>
                    <line x1="1" x2="23" y1="10" y2="10"></line>
                  </svg>
                </div>
              </div>
              <div class="stat-card-value">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-header">
                <span class="stat-card-label">Active Backers</span>
                <div class="stat-card-icon">
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                  >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                  </svg>
                </div>
              </div>
              <div class="stat-card-value">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-header">
                <span class="stat-card-label">Campaign Score</span>
                <div class="stat-card-icon gold">
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                  >
                    <polygon
                      points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"
                    ></polygon>
                  </svg>
                </div>
              </div>
              <div class="stat-card-value">—</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title" id="records-title">Records</h3>
            </div>
            <div class="card-body" id="dashboard-records">Loading…</div>
          </div>
        </div>
      </main>
    </div>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
